<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <metadata>
    <title>High-altitude telemetry payload wiring diagram</title>
    <creator>Trishan Biswas</creator>
    <description>Project started February 2026; ongoing.</description>
  </metadata>
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #15202b; }
      .subtitle { font: 16px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 3; rx: 14; }
      .esp { fill: #e8f5e9; stroke: #166534; stroke-width: 4; rx: 16; }
      .head { font: 700 21px Arial, sans-serif; fill: #111827; }
      .pin { font: 16px Consolas, monospace; fill: #111827; }
      .note { font: 14px Arial, sans-serif; fill: #4b5563; }
      .wire { fill: none; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .pwr { stroke: #dc2626; }
      .gnd { stroke: #111827; }
      .sda { stroke: #0891b2; }
      .scl { stroke: #7c3aed; }
      .sck { stroke: #ea580c; }
      .mosi { stroke: #2563eb; }
      .miso { stroke: #0d9488; }
      .ctrl { stroke: #16a34a; }
      .adc { stroke: #db2777; }
      .node { fill: #ffffff; stroke-width: 3; }
      .label { font: 700 14px Arial, sans-serif; paint-order: stroke; stroke: white; stroke-width: 5px; }
    </style>
  </defs>

  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" class="title">ESP32 High-altitude Payload — Wiring Diagram</text>
  <text x="700" y="68" text-anchor="middle" class="subtitle">Match signal names on the modules; 14-pin TFT header order varies by manufacturer.</text>

  <!-- ESP32 -->
  <rect x="510" y="105" width="380" height="585" class="esp"/>
  <text x="700" y="140" text-anchor="middle" class="head">ESP32 DEVKIT V1</text>
  <text x="535" y="185" class="pin">3V3</text>
  <text x="535" y="220" class="pin">GND</text>
  <text x="535" y="270" class="pin">GPIO21  SDA</text>
  <text x="535" y="310" class="pin">GPIO22  SCL</text>
  <text x="535" y="370" class="pin">GPIO34  BUTTON</text>
  <text x="535" y="410" class="pin">GPIO35  BAT ADC</text>
  <text x="535" y="470" class="pin">GPIO25  LED</text>
  <text x="535" y="510" class="pin">GPIO26  PIEZO</text>
  <text x="535" y="575" class="pin">VIN  (regulated 5 V only)</text>

  <text x="865" y="185" text-anchor="end" class="pin">3V3</text>
  <text x="865" y="220" text-anchor="end" class="pin">GND</text>
  <text x="865" y="270" text-anchor="end" class="pin">GPIO18  SCK</text>
  <text x="865" y="310" text-anchor="end" class="pin">GPIO23  MOSI</text>
  <text x="865" y="350" text-anchor="end" class="pin">GPIO19  MISO</text>
  <text x="865" y="400" text-anchor="end" class="pin">GPIO15  TFT CS</text>
  <text x="865" y="440" text-anchor="end" class="pin">GPIO2   TFT DC</text>
  <text x="865" y="480" text-anchor="end" class="pin">GPIO4   TFT RST</text>
  <text x="865" y="520" text-anchor="end" class="pin">GPIO5   SD CS</text>

  <!-- I2C boards -->
  <rect x="45" y="105" width="315" height="205" class="box"/>
  <text x="202" y="138" text-anchor="middle" class="head">AHT20 + BMP280</text>
  <text x="70" y="180" class="pin">VCC → 3V3</text>
  <text x="70" y="215" class="pin">GND → GND</text>
  <text x="70" y="260" class="pin">SDA → GPIO21</text>
  <text x="70" y="295" class="pin">SCL → GPIO22</text>

  <rect x="45" y="345" width="315" height="220" class="box"/>
  <text x="202" y="378" text-anchor="middle" class="head">MPU6050 GY-521</text>
  <text x="70" y="420" class="pin">VCC → 3V3</text>
  <text x="70" y="455" class="pin">GND → GND</text>
  <text x="70" y="495" class="pin">SDA → GPIO21</text>
  <text x="70" y="530" class="pin">SCL → GPIO22</text>
  <text x="70" y="554" class="note">XDA, XCL, AD0, INT: leave open</text>

  <!-- I2C wiring -->
  <path d="M360 260 H430 V270 H510" class="wire sda"/>
  <path d="M360 495 H430 V270" class="wire sda"/>
  <text x="438" y="258" class="label" fill="#0891b2">SDA</text>
  <path d="M360 295 H455 V310 H510" class="wire scl"/>
  <path d="M360 530 H455 V310" class="wire scl"/>
  <text x="463" y="298" class="label" fill="#7c3aed">SCL</text>
  <path d="M360 180 H475 V185 H510" class="wire pwr"/>
  <path d="M360 420 H475 V185" class="wire pwr"/>
  <path d="M360 215 H490 V220 H510" class="wire gnd"/>
  <path d="M360 455 H490 V220" class="wire gnd"/>

  <!-- TFT/SD combo -->
  <rect x="1040" y="105" width="315" height="500" class="box"/>
  <text x="1198" y="138" text-anchor="middle" class="head">ST7789V + onboard SD</text>
  <text x="1065" y="180" class="pin">VCC, BL → 3V3</text>
  <text x="1065" y="220" class="pin">GND → GND</text>
  <text x="1065" y="270" class="pin">SCK/CLK → GPIO18</text>
  <text x="1065" y="310" class="pin">MOSI/SDA → GPIO23</text>
  <text x="1065" y="350" class="pin">MISO → GPIO19</text>
  <text x="1065" y="400" class="pin">TFT CS → GPIO15</text>
  <text x="1065" y="440" class="pin">DC → GPIO2</text>
  <text x="1065" y="480" class="pin">RST/RES → GPIO4</text>
  <text x="1065" y="520" class="pin">SD CS → GPIO5</text>
  <text x="1065" y="565" class="note">Do not join the two CS pins.</text>
  <text x="1065" y="587" class="note">Use a short, keyed harness.</text>

  <path d="M890 185 H1040" class="wire pwr"/>
  <path d="M890 220 H1040" class="wire gnd"/>
  <path d="M890 270 H1040" class="wire sck"/>
  <path d="M890 310 H1040" class="wire mosi"/>
  <path d="M890 350 H1040" class="wire miso"/>
  <path d="M890 400 H1040" class="wire ctrl"/>
  <path d="M890 440 H1040" class="wire ctrl"/>
  <path d="M890 480 H1040" class="wire ctrl"/>
  <path d="M890 520 H1040" class="wire ctrl"/>

  <!-- Small output/input circuits -->
  <rect x="45" y="610" width="400" height="280" class="box"/>
  <text x="245" y="643" text-anchor="middle" class="head">Button, LED and buzzer</text>
  <text x="70" y="690" class="pin">3V3 ─ 10 kΩ ─┬─ GPIO34</text>
  <text x="70" y="720" class="pin">              └─ button ─ GND</text>
  <text x="70" y="770" class="pin">GPIO25 ─ 220 Ω ─ LED ─ GND</text>
  <text x="70" y="820" class="pin">GPIO26 ─ passive piezo ─ GND</text>
  <text x="70" y="852" class="note">Use a transistor if buzzer current exceeds ~8 mA.</text>
  <path d="M445 685 H485 V370 H510" class="wire ctrl"/>
  <path d="M445 765 H475 V470 H510" class="wire ctrl"/>
  <path d="M445 815 H465 V510 H510" class="wire ctrl"/>

  <!-- Power and battery sense -->
  <rect x="510" y="745" width="845" height="180" class="box"/>
  <text x="932" y="778" text-anchor="middle" class="head">Standalone power — build only after USB operation is proven</text>
  <text x="540" y="820" class="pin">Protected BAT+ ─ switch ─ 5 V boost ─────────→ ESP32 VIN</text>
  <text x="540" y="855" class="pin">Protected BAT− ─────────────────────────────→ ESP32 GND</text>
  <text x="540" y="895" class="pin">BAT+ ─ 100 kΩ ─┬─ GPIO35     node ─ 100 kΩ ─ GND</text>
  <text x="746" y="918" class="note">└─ 100 nF ─ GND</text>
  <path d="M890 820 H955 V720 H480 V575 H510" class="wire pwr"/>
  <path d="M825 890 H980 V735 H465 V410 H510" class="wire adc"/>

  <!-- Legend -->
  <text x="45" y="950" class="note">Colours: </text>
  <text x="115" y="950" class="label" fill="#dc2626">3V3/5V</text>
  <text x="195" y="950" class="label" fill="#111827">GND</text>
  <text x="250" y="950" class="label" fill="#0891b2">SDA</text>
  <text x="305" y="950" class="label" fill="#7c3aed">SCL</text>
  <text x="360" y="950" class="label" fill="#ea580c">SCK</text>
  <text x="415" y="950" class="label" fill="#2563eb">MOSI</text>
  <text x="485" y="950" class="label" fill="#0d9488">MISO</text>
  <text x="555" y="950" class="label" fill="#16a34a">control</text>
  <text x="635" y="950" class="label" fill="#db2777">battery sense</text>
</svg>

